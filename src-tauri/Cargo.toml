[package]
name = "kiebitz"
# Hinweis: Die angezeigte App-Version kommt aus tauri.conf.json, nicht von hier.
version = "0.1.1"
description = "Kiebitz — local-first desktop chess companion"
authors = ["Torim98"]
homepage = "https://kiebitz.dev/"
repository = "https://github.com/kiebitz-dev/Kiebitz"
# Source-available, kein OSI-Open-Source — Bedingungen in ../LICENSE.
license-file = "../LICENSE"
publish = false
edition = "2021"
# Angabe hält, was der Abhängigkeitsbaum wirklich verlangt · die höchste
# MSRV im Baum kommt derzeit von `aes` und `notify-rust` (1.89).
rust-version = "1.89"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Google-Play-Build: Android darf sich ausschließlich über Play aktualisieren.
# Der Feature-Schalter entfernt den GitHub-APK-Updater samt Download-URL aus
# dem Mobile-Binary; Desktop- und Sideload-Builds bleiben unverändert.
play-store = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
semver = "1"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Öffnet externe Links im System-Standardbrowser (auch Mobile-tauglich).
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Lokale Erinnerungen an fälliges Training (Desktop und Android).
tauri-plugin-notification = "2"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
# Schachregeln, SAN und FEN. Bewusst owlchess (MIT) und nicht shakmaty: das ist
# GPL-3.0+ und hätte Kiebitz statisch gelinkt zu einem abgeleiteten Werk
# gemacht. Stockfish ist davon unberührt — eigener Prozess über UCI.
owlchess = "0.4.1"
csv = "1.4.0"
# Bewusst auf der 2er-Linie. Version 3 hat die TLS-Einrichtung umgebaut: Statt
# einer fertigen `rustls::ClientConfig` nimmt sie ihre eigene TlsConfig
# entgegen, und ein eigener Zertifikatsprüfer — genau das, worauf das
# Pinning des Sync-Pairings steht (siehe sync/server.rs) — hat dort keine
# Entsprechung. Ein Umstieg hieße, das Pinning neu zu erfinden; dafür ist eine
# gepflegte 2.12 ohne offene Sicherheitsmeldung der bessere Stand.
ureq = "2"
zstd = "0.13.3"
# Sync-Client: Zertifikats-Pinning im QR-Pairing.
rustls = "0.23"
sha2 = "0.10"
# Anmelde-Deep-Link `kiebitz://auth?code=…` aus dem Magic-Link der E-Mail.
tauri-plugin-deep-link = "2"

# Signierte Desktop-Auto-Updates laufen über den Tauri-Updater. Android-
# Sideload-Builds prüfen denselben Release-Feed; Play-Builds kompilieren diesen
# Pfad über das Feature `play-store` vollständig heraus.
#
# Dieselbe Bedingung ist Tauris `desktop`-Alias, unter dem in sync.rs der Hub
# steht. Die drei Sync-Crates gehören deshalb hierher und nicht unter
# `cfg(windows)`: dort fehlten sie einem macOS- oder Linux-Build, obwohl der
# Hub-Code dort mitkompiliert wird.
# qrcode: erzeugt den Pairing-QR (Desktop-Hub zeigt ihn, das Handy scannt).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Ohne dieses Plugin erreicht der Anmelde-Deep-Link eine bereits laufende App
# unter Windows und Linux nie: Das Betriebssystem startet dort einen zweiten
# Prozess mit der URL im Aufruf, statt sie der offenen Instanz zu geben. Die
# Feature-Flagge `deep-link` reicht sie an das Deep-Link-Plugin weiter, sodass
# `onOpenUrl` in der laufenden Instanz auslöst.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Konto- und Entitlement-Token gehören in den Schlüsselspeicher des Systems,
# nicht in eine Datei. Die drei Stores sind je Zielsystem aktiv; die
# Secret-Service-Anbindung läuft bewusst über zbus statt libdbus, damit ein
# Linux-Build keine C-Bibliothek voraussetzt.
keyring = { version = "4.2", features = [
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }
qrcode = { version = "0.14", default-features = false }
# Sync-Server (Desktop als Hub) — HTTPS mit dauerhaftem selbstsigniertem Zertifikat.
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
rcgen = "0.14"
rustls-pemfile = "2"

# Windows-Toasts direkt ansteuern: das Notification-Plugin verschluckt Fehler,
# und die Erinnerung soll melden, wenn Windows sie ablehnt.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
# Registry direkt statt ueber `reg.exe`. Ein unsigniertes Programm, das
# versteckte `reg add`-Prozesse startet, sieht fuer die Verhaltenserkennung von
# Defender aus wie ein Schaedling, der sich einnistet · siehe reminder.rs.
windows-registry = "0.6"

# Die Webview unter Linux · für die Absturzwache des WebKit-Prozesses in
# watchdog.rs. Dieselbe Version, die Tauri (wry) ohnehin mitbringt.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_20"] }

# QR-Scanner (nur Mobile): das Handy liest den Pairing-QR des Desktops per Kamera.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
