name: Release

# Ein getaggter Commit (v*) löst einen kompletten Release-Build aus:
# bauen → signieren → GitHub-Release anlegen → latest.json hochladen.
# Installierte Apps holen sich das Update dann beim nächsten Start.
#
# Vier Phasen:
#   prepare-release  — legt einen privaten Draft-Release an.
#   desktop/android/ — bauen danach parallel und hängen ihre Artefakte an den
#   stockfish-source   Draft (Letzterer den GPL-Quellcode der Engine). Auch die
#                      drei Legs der Desktop-Matrix laufen parallel.
#   updater-manifest — erzeugt danach einmalig die gemeinsame `latest.json`.
#   publish          — veröffentlicht den Draft erst, wenn alles erfolgreich war.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # nötig, damit die Action das Release anlegen darf

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Draft-Release anlegen
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh kann das Repository ohne Checkout nicht aus .git ableiten.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$draft" = "true" ] || { echo "::error::Release $TAG ist bereits veröffentlicht."; exit 1; }
            echo "Wiederverwendung des vorhandenen Draft-Releases $TAG"
          else
            # Der Text steht zentral am einmalig angelegten Draft; die parallelen
            # Desktop-Läufe laden anschließend nur ihre eigenen Artefakte hoch.
            cat > notes.md <<'NOTES'
          Automatically built from the tag.

          - **Windows** — `.exe` (NSIS) or `.msi`; installed copies auto-update.
          - **macOS** — `.dmg` for Apple Silicon. The build is *not* notarized: on
            first start use right-click → Open, or run
            `xattr -dr com.apple.quarantine /Applications/Kiebitz.app`.
          - **Linux** — `.AppImage`, `.deb` and `.rpm` for x86-64. Only the
            AppImage auto-updates; `.deb`/`.rpm` are updated by hand.
          - **Android** — the signed APK is offered in Settings.
          NOTES
            gh release create "$TAG" --draft --title "Kiebitz $TAG" --notes-file notes.md
          fi
          # REST endpoints and tauri-action both need the numeric databaseId.
          # `--json id` would return a GraphQL node ID (RE_kw...), which causes
          # /repos/{owner}/{repo}/releases/{release_id} to return HTTP 404.
          echo "release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  stockfish-source:
    # GPL-3.0 §6: Wer ein Binary ausliefert, muss den exakt korrespondierenden
    # Quellcode mitliefern oder anbieten. Damit das Angebot in NOTICE.txt nicht
    # von der Erreichbarkeit fremder Server abhängt, landet der Stockfish-
    # Quellstand als Asset an *demselben* Release wie die Binaries.
    #
    # Der Baum wird per git geholt und über die Objekt-Hashes gegen den
    # gepinnten Commit geprüft — verlässlicher als ein SHA-256 auf GitHubs
    # generierte Archive, die nicht byte-stabil sind. `git archive` erzeugt
    # daraus ein Tarball, das genau diesen Commit-Baum enthält.
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain-Pins laden
        run: node scripts/export-toolchain-pins.mjs --github-env

      - name: Stockfish-Quellcode holen und ans Release hängen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          commit="$STOCKFISH_COMMIT"
          # Der Dateiname trägt den Commit, nicht die Kiebitz-Version: so bleibt
          # die in NOTICE.txt genannte /releases/latest/download/-URL stabil.
          out="$GITHUB_WORKSPACE/$STOCKFISH_SOURCE_ASSET"

          git init -q sf-src
          git -C sf-src remote add origin "$STOCKFISH_REPOSITORY"
          git -C sf-src fetch -q --depth 1 origin "$commit"
          git -C sf-src checkout -q FETCH_HEAD
          have=$(git -C sf-src rev-parse HEAD)
          if [ "$have" != "$commit" ]; then
            echo "::error::Stockfish-Quellcode: erwartet $commit, erhalten $have"
            exit 1
          fi

          git -C sf-src archive --format=tar.gz \
            --prefix="stockfish-${STOCKFISH_VERSION}-${commit:0:12}/" -o "$out" FETCH_HEAD

          echo "Quellarchiv: $(basename "$out") ($(du -h "$out" | cut -f1))"
          echo "SHA-256: $(sha256sum "$out" | cut -d' ' -f1)"
          gh release upload "$TAG" "$out" --clobber

  desktop:
    needs: prepare-release
    name: desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
          # macos-latest ist Apple Silicon; der Build ist entsprechend arm64.
          # Intel-Macs brauchen einen zweiten Lauf (siehe docs/DEPLOYMENT.md).
          - os: macos-latest
            label: macOS arm64
          # Bewusst nicht ubuntu-latest: das AppImage bindet die glibc des
          # Build-Systems, und 22.04 läuft auch auf älteren Distributionen.
          - os: ubuntu-22.04
            label: Linux x64
    steps:
      - uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Toolchain-Pins laden
        run: node scripts/export-toolchain-pins.mjs --github-env

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Build cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK ist unter Linux die Webview; die übrigen Pakete braucht der
      # Tauri-Bundler für AppImage, deb und rpm.
      - name: Linux-Systemabhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libfuse2 patchelf file build-essential

      - name: Frontend-Abhängigkeiten installieren
        run: npm ci

      # Stockfish wird nicht mit eingecheckt (GPL, Größe) und muss vor dem
      # Bundle in src-tauri/binaries/ liegen. Release und Hash sind bewusst
      # gepinnt, damit der exakte GPL-Quellstand reproduzierbar bleibt.
      - name: Stockfish holen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $url = $env:STOCKFISH_WINDOWS_URL
          $expected = $env:STOCKFISH_WINDOWS_SHA256
          Invoke-WebRequest $url -OutFile sf.zip
          $actual = (Get-FileHash sf.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Stockfish archive has unexpected SHA-256: $actual" }
          Expand-Archive sf.zip -DestinationPath sf -Force
          $exe = Get-ChildItem sf -Recurse -Filter *.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $exe.FullName src-tauri/binaries/stockfish.exe
          Write-Host "Stockfish $env:STOCKFISH_VERSION gebündelt: $env:STOCKFISH_WINDOWS_ARCHIVE ($actual)"

      # macOS und Linux: aus demselben gepinnten Commit bauen, den der
      # stockfish-source-Job als Quellarchiv ans Release hängt — so wie es der
      # Android-Job schon tut. Ein Commit-Pin ist dabei genauer als ein Hash auf
      # ein fertiges Archiv: Er belegt, dass Binary und mitgelieferter Quellcode
      # (GPL-3.0 §6) exakt zusammengehören.
      - name: Stockfish bauen (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          commit="$STOCKFISH_COMMIT"
          git clone --filter=blob:none --no-checkout "$STOCKFISH_REPOSITORY" sf-src
          git -C sf-src fetch --depth 1 origin "$commit"
          git -C sf-src checkout --detach "$commit"
          test "$(git -C sf-src rev-parse HEAD)" = "$commit"
          if [ "$RUNNER_OS" = "macOS" ]; then
            arch=apple-silicon
            comp=clang
          else
            arch=x86-64-avx2
            comp=gcc
          fi
          cd sf-src/src
          # Lädt die eingebetteten NNUE-Netze; ohne sie bricht der Build ab.
          ../scripts/net.sh
          make -j2 build ARCH="$arch" COMP="$comp"
          strip stockfish
          cd ../..
          mkdir -p src-tauri/binaries
          cp sf-src/src/stockfish src-tauri/binaries/stockfish
          chmod +x src-tauri/binaries/stockfish
          echo "Stockfish $STOCKFISH_VERSION ($arch/$comp) aus $commit gebaut"

      - name: Bauen, signieren & Artefakte an Draft-Release anhängen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signaturschlüssel für den Updater (Repo-Secret, siehe DEPLOYMENT.md).
          # Er signiert die Update-Pakete aller drei Plattformen; die
          # Code-Signatur des jeweiligen Betriebssystems ist etwas anderes und
          # gibt es bisher nur unter Windows (siehe DEPLOYMENT.md → Signing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # Eindeutige Zuordnung zum Draft aus prepare-release. Damit kann der
          # Desktop-Job keinen zweiten Release für denselben Tag erzeugen.
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: "Kiebitz ${{ github.ref_name }}"
          # Der Draft existiert bereits; tauri-action lädt Signaturen und
          # Installer daran hoch. Die gemeinsame latest.json entsteht erst nach
          # allen parallelen Matrix-Legs, damit es keinen Schreibkonflikt gibt.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

  updater-manifest:
    # Alle Desktop-Artefakte und Signaturen sind jetzt am Draft. Das Manifest
    # wird genau einmal aus diesem vollständigen Satz erzeugt; dadurch können die
    # drei teuren Builds parallel laufen, ohne Einträge in latest.json zu verlieren.
    needs: [prepare-release, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Gemeinsames Desktop-Update-Manifest erzeugen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          TAG: ${{ github.ref_name }}
        run: node scripts/generate-updater-manifest.mjs

      - name: Manifest an Draft-Release anhängen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" latest.json --clobber

  android:
    # Startet parallel zum Desktop-Build; der Draft-Release existiert bereits.
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      # Android-Keystore als Base64-Secret (siehe DEPLOYMENT.md, One-time setup).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      # Ohne Keystore-Secret kann keine installierbare (signierte) APK entstehen.
      # Dann den Android-Teil überspringen, statt das ganze Release rot zu färben.
      - name: Keystore vorhanden?
        id: guard
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 ist nicht gesetzt — Android-APK wird übersprungen. Setup siehe docs/DEPLOYMENT.md."
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.has_keystore == 'true'

      - name: Node einrichten
        if: steps.guard.outputs.has_keystore == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Toolchain-Pins laden
        if: steps.guard.outputs.has_keystore == 'true'
        run: node scripts/export-toolchain-pins.mjs --github-env

      - name: JDK 17 einrichten
        if: steps.guard.outputs.has_keystore == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK/NDK einrichten
        if: steps.guard.outputs.has_keystore == 'true'
        uses: android-actions/setup-android@v4

      - name: NDK + Plattform installieren
        if: steps.guard.outputs.has_keystore == 'true'
        run: |
          sdkmanager "platform-tools" "platforms;android-$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Rust + Android-Targets einrichten
        if: steps.guard.outputs.has_keystore == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust-Build cachen
        if: steps.guard.outputs.has_keystore == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Frontend-Abhängigkeiten installieren
        if: steps.guard.outputs.has_keystore == 'true'
        run: npm ci

      # Stockfish fuer Android reproduzierbar aus dem gepinnten Commit
      # bauen. NDK r28 und 16-KB-Linker-Alignment erfuellen die Play-Anforderung;
      # plain armv8 (kein -dotprod) bleibt breit kompatibel.
      - name: Stockfish bauen (Android, armv8, 16 KB)
        if: steps.guard.outputs.has_keystore == 'true'
        run: |
          commit="$STOCKFISH_COMMIT"
          git clone --filter=blob:none --no-checkout "$STOCKFISH_REPOSITORY" sf-src
          git -C sf-src fetch --depth 1 origin "$commit"
          git -C sf-src checkout --detach "$commit"
          test "$(git -C sf-src rev-parse HEAD)" = "$commit"
          export PATH="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd sf-src/src
          ../scripts/net.sh
          make -j2 build ARCH=armv8 COMP=ndk \
            EXTRALDFLAGS="-Wl,-z,max-page-size=$ANDROID_PAGE_SIZE"
          llvm-strip stockfish
          while read -r alignment; do
            if (( alignment < ANDROID_PAGE_SIZE )); then
              echo "::error::Stockfish LOAD alignment is only $(printf '0x%x' "$alignment")."
              exit 1
            fi
          done < <(llvm-readelf -lW stockfish | awk '$1 == "LOAD" { print $NF }')
          cd ../..
          dest=src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest"
          cp sf-src/src/stockfish "$dest/libstockfish.so"
          echo "Stockfish $STOCKFISH_VERSION built from $commit -> $dest/libstockfish.so"

      # Keystore aus dem Secret wiederherstellen und die von Gradle gelesene
      # keystore.properties erzeugen (beide sind gitignored).
      - name: Keystore einrichten
        if: steps.guard.outputs.has_keystore == 'true'
        run: |
          cd src-tauri/gen/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      # Schnell scheitern, bevor der lange Build läuft. -certreq greift wirklich
      # auf den privaten Schlüssel zu und prüft damit Store- UND Key-Passwort
      # (genau der Mismatch, der sonst erst nach Minuten beim Signieren auffliegt)
      # sowie Alias und Keystore-Inhalt in einem Rutsch.
      - name: Keystore prüfen
        if: steps.guard.outputs.has_keystore == 'true'
        run: |
          cd src-tauri/gen/android
          if ! keytool -certreq -alias "$ANDROID_KEY_ALIAS" -keystore keystore.jks \
                -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore-Check fehlgeschlagen: Alias, Store- oder Key-Passwort passen nicht zum Keystore. ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD prüfen — bei PKCS12 (keytool-Default) müssen Store- und Key-Passwort identisch sein. Siehe docs/DEPLOYMENT.md."
            exit 1
          fi
          echo "Keystore ok: Alias '$ANDROID_KEY_ALIAS', Store- und Key-Passwort passen."

      - name: Android-APK bauen (release, arm64)
        if: steps.guard.outputs.has_keystore == 'true'
        run: npx tauri android build --apk --target aarch64

      # Signierte APK finden, versioniert umbenennen und ans Release hängen.
      - name: APK ans Release hängen
        if: steps.guard.outputs.has_keystore == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          apk=$(find src-tauri/gen/android -path "*/outputs/apk/*/release/*.apk" | head -n1)
          [ -n "$apk" ] || { echo "Keine Release-APK gefunden"; exit 1; }
          out="Kiebitz_${version}_arm64.apk"
          cp "$apk" "$out"
          echo "Lade $out ($(du -h "$out" | cut -f1)) zu Release ${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" "$out" --clobber

  publish:
    # Bei einem fehlgeschlagenen Build bleibt der Draft als Diagnose-Artefakt
    # erhalten; nur ein vollständiger Release wird öffentlich. stockfish-source
    # gehört bewusst dazu: kein öffentliches Binary ohne seinen Quellcode.
    #
    # `updater-manifest` wartet bereits auf alle drei Desktop-Betriebssysteme.
    # Ein erneuter Lauf des Tags nimmt den Draft wieder auf, statt einen zweiten
    # Release anzulegen (siehe prepare-release).
    needs: [stockfish-source, updater-manifest, android]
    runs-on: ubuntu-latest
    steps:
      - name: Draft-Release veröffentlichen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auch dieser Job hat keinen Checkout; Repository explizit setzen.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
